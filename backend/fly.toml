# fly.toml for backend
app = "ass-tut-backend"
primary_region = "iad"

[build]

[deploy]
  release_command = "alembic upgrade head"

[env]
  JWT_ALGORITHM = "HS256"
  JWT_EXPIRE_MINUTES = "1440"

[http_service]
  internal_port = 8000
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
