[alembic]
script_location = alembic
# In Docker the DATABASE_URL env var is set and overrides this in env.py.
# For local dev outside Docker, set DATABASE_URL in backend/.env instead.
# This fallback uses the Docker service hostname so alembic works inside the container.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@postgres:5432/asstut

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
