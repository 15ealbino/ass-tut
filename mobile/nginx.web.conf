server {
    listen 80;
    root /usr/share/nginx/html;

    # Bare /app -> canonical trailing slash.
    location = /app { return 301 /app/; }

    # SPA served under /app/. Unknown sub-paths fall back to the app's
    # index.html so client-side navigation (deep links, refresh) works.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
}
