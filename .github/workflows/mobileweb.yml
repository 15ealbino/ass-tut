name: Build mobileweb image

# Builds the Expo web export (mobile/Dockerfile.web) off-VM and publishes it to
# GHCR, so the memory-limited production VM only has to `docker pull` it instead
# of running the heavy `npm ci` + Metro bundle itself.

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobileweb.yml'
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/15ealbino/ass-tut-mobileweb

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mobile
          file: ./mobile/Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
