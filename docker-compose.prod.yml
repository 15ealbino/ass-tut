services:
  backend:
    ports: !reset []
    expose:
      - "8000"

  frontend:
    ports: !reset []
    expose:
      - "80"

  # Use the CI-built image from GHCR instead of building the heavy Expo bundle
  # on the memory-limited VM. `pull_policy: always` fetches the latest push.
  mobileweb:
    build: !reset null
    image: ghcr.io/15ealbino/ass-tut-mobileweb:latest
    pull_policy: always

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. assembly-tutorial.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
